name: 功能建议 / Feature request
description: 描述你的资料查找任务与期望改进 / Describe your task and proposed improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？ / What problem are you solving?
      description: 请说明实际场景和目前的处理办法；不要包含私人资料。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到什么结果？ / Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息 / Alternatives and context
